services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: mdesigner-dynamodb
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8000 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3

  s3-local:
    image: localstack/localstack:latest
    container_name: mdesigner-s3
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - DEFAULT_REGION=ap-northeast-2
    healthcheck:
      test: ["CMD-SHELL", "awslocal s3 ls || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mdesigner-api
    ports:
      - "8080:8000"
    environment:
      - MDESIGNER_ENVIRONMENT=development
      - MDESIGNER_DYNAMODB_ENDPOINT_URL=http://dynamodb-local:8000
      - MDESIGNER_S3_ENDPOINT_URL=http://s3-local:4566
      - MDESIGNER_S3_BUCKET_NAME=mdesigner-files
      - MDESIGNER_AWS_REGION=ap-northeast-2
      - MDESIGNER_JWT_SECRET_NAME=dev-secret-key-change-in-production
      - MDESIGNER_CORS_ORIGINS=["http://localhost:5173"]
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - AWS_DEFAULT_REGION=ap-northeast-2
    depends_on:
      dynamodb-local:
        condition: service_healthy
      s3-local:
        condition: service_healthy
