[tool.poetry]
name = "mobile-designer-api"
version = "0.1.0"
description = "Mobile Designer - Backend API"
authors = ["Team <team@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = ">=0.30"}
pydantic = {extras = ["email"], version = "^2.0"}
pydantic-settings = "^2.0"
boto3 = "^1.35"
aioboto3 = "^13"
PyJWT = "^2.8"
bcrypt = "^4.0"
jinja2 = "^3.1"
python-ulid = "^3.0"
structlog = "^24"
httpx = "^0.27"
sse-starlette = "^2"
python-multipart = "^0.0.9"
python-docx = "^1.0"
opendataloader-pdf = "*"
strands-agents = "^1.39"

[tool.poetry.group.dev.dependencies]
pytest = "^8"
pytest-asyncio = "^0.24"
pytest-cov = "^5"
moto = {extras = ["dynamodb", "s3", "ses"], version = "^5"}
ruff = "^0.6"
mypy = "^1.11"
pre-commit = "^3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM", "TCH"]
# N815/N806: DynamoDB attributes and request bodies use camelCase to match the
# stored schema. N818: AppException is the established base-class name.
ignore = ["N815", "N806", "N818"]

[tool.ruff.lint.per-file-ignores]
# These modules embed long LLM prompt / generated-Kotlin string literals that must
# not be wrapped.
"src/ai/orchestrator.py" = ["E501"]
"src/handoff/code_generator/llm_code_generator.py" = ["E501"]
"src/handoff/code_generator/compose_spec.py" = ["E501"]
"src/handoff/code_generator/generator.py" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

# Third-party packages that ship no type stubs / py.typed marker.
[[tool.mypy.overrides]]
module = [
    "aioboto3.*",
    "botocore.*",
    "opendataloader_pdf.*",
    "strands.*",
    "docx.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
